name: sii-mb
services:
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: sii_mb
      POSTGRES_USER: sii_mb
      POSTGRES_PASSWORD: ${SII_MB_DB_PASSWORD:?Define SII_MB_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U sii_mb -d sii_mb"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      SII_MB_DATABASE_URL: postgresql+psycopg://sii_mb:${SII_MB_DB_PASSWORD}@database:5432/sii_mb
      SII_MB_UI_ORIGINS: http://127.0.0.1:3000
      SII_MB_ADMIN_USERNAME: ${SII_MB_ADMIN_USERNAME:-admin}
      SII_MB_ADMIN_PASSWORD: ${SII_MB_ADMIN_PASSWORD:?Define a password of at least 12 characters}
    ports:
      - 127.0.0.1:8000:8000
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
  frontend:
    build: ./frontend
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      backend:
        condition: service_healthy
  test:
    profiles: [test]
    build:
      context: ./backend
      target: test
    environment:
      SII_MB_TEST_POSTGRES_URL: postgresql+psycopg://sii_mb:${SII_MB_DB_PASSWORD}@database:5432/sii_mb
    depends_on:
      database:
        condition: service_healthy
volumes:
  postgres_data:
